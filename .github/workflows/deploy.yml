# Builds the site and publishes it to GitHub Pages.
#
# Runs on every change to `main` (including edits saved in Pages CMS), once a day so
# past events move out of "Upcoming", and on demand from the Actions tab.
# If the build fails (for example, a required field was left blank), nothing is
# published and the live site stays on the last good version.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 5 a.m. Eastern (daylight time)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
