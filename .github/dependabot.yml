# Opens a monthly pull request to keep dependencies up to date.
# CI runs on each one; merge it if the checks pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # @astrojs/check and typescript-eslint only support TypeScript <= 6.0.
      # Remove this once they support TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      all-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
