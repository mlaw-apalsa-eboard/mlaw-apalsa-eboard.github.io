name: Quynh-An Vo
role: External Relations Chair
photo: /src/assets/uploads/board/quynh-an-vo.webp
bio: >-
  Quynh-An is a 2L from Malden, MA. She majored in Industrial Engineering at Northeastern and
  worked as a paralegal after graduating in 2024. Quynh-An spent her 1L summer in the MLaw Low
  Income Taxpayer Clinic and will be joining a Boston law firm for her 2L summer. She is currently
  Social Chair of Res Sista Loquitur and First Year Information Communications Chair of Wolverine
  Street Law. She likes Ultimate Frisbee, sewing, and watching TV dramas and football.
