name: Aryssa Ham
role: Vice President
photo: /src/assets/uploads/board/aryssa-ham.webp
bio: >-
  Aryssa is a 2L from the Bay Area and aspiring public defender. After graduating from UC Davis in
  2020 with a Sociology and Psychology degree, Aryssa worked for a plaintiff-side class action law
  firm and the Ninth Circuit. She spent her 1L summer in NYC at the Legal Aid Society. Outside of
  APALSA, she is a board member of MDefenders, an editor on the Michigan Journal of Race & Law,
  and a student attorney with the Juvenile Justice Clinic and the Sentence Commutation Project.
  She loves to swim, juggle up to three spherical items, and root for the Buffalo Bills.
