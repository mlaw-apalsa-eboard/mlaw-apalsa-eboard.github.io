bio: >-
  Liam is a 1L from Honolulu, HI. He graduated from Cornell University in 2024, where he majored
  in Communication. Before law school he was a legal project manager at Morningside Technology
  Advisory. At Michigan Law, he is involved in International Law Society and Business Law
  Association. He enjoys calisthenics, cooking food from home, and watching the Atlanta Falcons
  break his heart. Before he graduates, he hopes to visit all 162 parks in Ann Arbor.
