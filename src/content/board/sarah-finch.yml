name: Sarah Finch
role: Development Chair
photo: /src/assets/uploads/board/sarah-finch.webp
bio: >-
  Sarah is a 2L from Gilroy, CA. At UCLA, she double majored in Psychology and Political Science.
  After graduating in 2023, she served as a junior paralegal at Hueston Hennigan LLP. Sarah
  completed a judicial externship in Oahu, HI for her 1L summer and will be joining Latham &
  Watkins in SF for her 2L summer. Outside of APALSA, she is the Alumni and Outreach Chair for
  CALSA. Her favorite activities include petting cats, watching Bob’s Burgers, and cheering on Bay
  Area sports teams.
