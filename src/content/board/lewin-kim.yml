name: Lewin Junwon Kim
role: 3L Representative
photo: /src/assets/uploads/board/lewin-kim.webp
bio: >-
  Lewin is a Korean-American 3L from NY. He graduated from NYU Stern in 2019, where he majored in
  Business with concentrations in Statistics and Marketing. Before law school, he worked in survey
  design in Philadelphia and in ad sales pricing analysis at Warner Bros Discovery. His 1L summer
  was split between the Ann Arbor City Attorney's Office and Yoon & Yang in Seoul, Korea. He spent
  his 2L summer at Milbank in NY. He is a big fan of forgotten 00s movies, French house music, and
  the Brooklyn Nets.
