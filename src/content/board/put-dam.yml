name: Put Dam
role: President
photo: /src/assets/uploads/board/put-dam.webp
bio: >-
  Put is a 2L from Worcester, MA. He graduated from Brown University in 2022 with a degree in
  Computer Science. Prior to law school, he worked as a software engineer, and hopes to pursue
  patent litigation work. Put spent his 1L summer in the MLaw AI Clinic and will be working at an
  IP boutique firm for his 2L summer. He is the current Communications Chair of IPSA, an Associate
  Editor on Michigan Law Review, and a member of First Generation Law Students. In his free time,
  Put loves watching horror movies and effusively praising New England Patriots football.
