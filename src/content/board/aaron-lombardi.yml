name: Aaron Lombardi
role: Political Action Chair
photo: /src/assets/uploads/board/aaron-lombardi.webp
bio: >-
  Aaron is a 2L from Pueblo, CO. He graduated from the University of Colorado Boulder in 2022 with
  a Political Science degree, then worked as a community organizer. He spent his 1L summer as a
  litigation intern at the NAACP Legal Defense Fund. Outside of APALSA, Aaron is involved in the
  Michigan Voting Project and MLR. In his free time, Aaron enjoys backpacking, reading, and
  winning the money from other APALSA members through Texas Hold’em.
