name: Irene Hwang
role: Treasurer
photo: /src/assets/uploads/board/irene-hwang.webp
bio: >-
  Irene is a 2L from Okemos, MI. She is a double wolverine who graduated from the University of
  Michigan in 2020 with a Biopsychology, Cognition, and Neuroscience major. Before law school,
  Irene conducted physiology research, worked for a nonprofit in Washtenaw County through
  AmeriCorps VISTA, and taught preschool. She spent her 1L summer as a judicial clerk and will
  join a Big Law firm in Northern California for her 2L summer. Irene is also the treasurer for
  CALSA and an Associate Editor on MLR. She likes to spend her time cooking, baking, and walking
  her dog.
