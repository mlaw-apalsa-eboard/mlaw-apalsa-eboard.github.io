name: Alex Yum
role: Private Practice Chair
photo: /src/assets/uploads/board/alex-yum.webp
bio: >-
  Alex is a 2L from Lower Gwynedd, PA. He graduated from UPenn in 2025 with a degree in Health and
  Societies. Alex spent his 1L summer as a Legal Intern at the Supreme Court of Korea, and his 2L
  summer will be with Latham & Watkins. In addition to APALSA, Alex is involved in Headnotes,
  Michigan Health Law Organization, and Michigan Law Review. He likes basketball, tennis,
  cheeseburgers, IU, Japan, and lying in bed. He sometimes spends his free time thinking about
  things, but generally tries to avoid doing so.
