name: Anais Fang
role: Internal Relations Chair
photo: /src/assets/uploads/board/anais-fang.webp
bio: >-
  Anais is a 2L from Kaohsiung, Taiwan. She graduated with an International Affairs degree from
  George Washington University in 2023. Prior to law school, she was a paralegal in Washington
  D.C. supporting her firm’s regulatory and appellate practice groups. Anais participated in
  LAWBreaks in her 1L year and worked at the University of Michigan’s Office of the General
  Counsel over the summer. Her 2L summer will be spent at Paul Hastings in NY. Anais finds joy in
  watching women’s basketball, baking sourdough, trying new restaurants, and fostering cats.
