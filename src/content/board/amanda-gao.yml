name: Amanda Gao
role: Development Chair
photo: /src/assets/uploads/board/amanda-gao.webp
bio: >-
  Amanda is a 2L from Cypress, CA. After graduating from Georgetown in 2022 with a degree in
  Healthcare Management and Policy, she worked at a public health nonprofit. Amanda spent her 1L
  summer as a law clerk at Washington State Attorney General’s Office, Agriculture and Health
  Division. She is the Project Manager for Civil Rights Litigation Clearinghouse, Law and
  Political Economy Co-Chair for NLG, and Editor for Michigan Journal of Health Law. In her spare
  time, Amanda enjoys dancing, hiking, camping, and cooking.
