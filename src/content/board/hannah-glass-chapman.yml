name: Hannah Glass-Chapman
role: 3L Representative
photo: /src/assets/uploads/board/hannah-glass-chapman.webp
bio: >-
  Hannah is a 3L from Kalamazoo, Michigan. She graduated from the University of Michigan in 2024
  with a double major in Asian Studies and Film, Television, & Media. Hannah spent her 1L summer
  at Nishimura & Asahi in Tokyo, Japan and her 2L summer at Lee and Li in Taipei, Taiwan. Hannah
  is also the Managing Online Editor of MJIL and Michigan Law Ambassador through the Center of
  International and Comparative Law. In her free time, Hannah draws, goes to the theater, and
  spends time with her cat, Orangie.
