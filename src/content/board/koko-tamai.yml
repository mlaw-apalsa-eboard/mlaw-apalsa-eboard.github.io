name: Koko Tamai
role: External Relations Chair
photo: /src/assets/uploads/board/koko-tamai.webp
bio: >-
  Koko is a 2L from Honolulu, HI. She graduated with a Music Performance degree from DePaul
  University in 2023, then spent 2 years working in English education on a Fulbright grant in
  Taiwan. Koko is spending her 1L and 2L summers with Morrison & Foerster in San Francisco. In
  addition to APALSA, she is Co-President of Res Sista Loquitur and a member of Squirrel Club.
  Outside of law school, she enjoys playing the oboe and searching for woodland critters at the
  Arb.
