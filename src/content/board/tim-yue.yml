bio: >-
  Tim is a 1L from Danville, CA. He graduated from UC Berkeley in 2024 with a history degree.
  Before law school, Tim taught English in Japan. He is a member of International Law Society and
  Vis Moot Court, and hopes to work in cross-border M&A at a Big Law firm after graduating.
  Outside of law school, Tim enjoys leveling up his wardrobe, working out, and playing video
  games.
