name: Stephanie Dark
role: Internal Relations Chair
photo: /src/assets/uploads/board/stephanie-dark.webp
bio: >-
  Stephanie is a 2L from Chelsea, MI. She is a double wolverine, graduating from University of
  Michigan in 2023 with a double major in Neuroscience and English. She worked as a paralegal in a
  plaintiff-side employment law firm in NY before coming to law school. Stephanie spent her 1L
  summer working in expungement with the Michigan Advocacy Program, as well as traveling to
  Turkiye and Georgia. She will spend her 2L summer in intellectual property litigation at
  Venable’s New York office. She loves reading, yoga, and traveling.
