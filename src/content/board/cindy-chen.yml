name: Cindy Chen
role: Secretary
photo: /src/assets/uploads/board/cindy-chen.webp
bio: >-
  Cindy is a 2L from Los Angeles, CA. She graduated from UC Berkeley in 2025, where she double
  majored in Cognitive Science and Psychology and was a sleep science researcher. She spent her 1L
  summer at Nishimura & Asahi in Tokyo and her 2L summer will be split between Cravath, Swaine,
  and Moore and a Public Defender’s office. Cindy is a member of MLaw Rocks and Michigan Climbing
  Club, an Associate Editor on Michigan Law Review, a board member of Sentence Commutation
  Project, and a 2027 Geneva Fellow. She is an avid tea drinker, and Latin dancer.
