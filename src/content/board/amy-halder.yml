name: Amy Halder
role: 1L Representative
photo: /src/assets/uploads/board/amy-halder.webp
bio: >-
  Amy is a 1L from Queens, NY. She attended Dartmouth College, graduating in 2024 with a double
  major in Economics and Philosophy. Before law school, she was a corporate paralegal at Fried
  Frank. Outside of APALSA, she is an active member of Women Law Students association, Business
  Law Association, and South Asian Law Students Association. In her free time, she likes to run,
  read, and practice pilates and yoga.
