name: Minna Chow
role: Public Interest Chair
photo: /src/assets/uploads/board/minna-chow.webp
bio: >-
  Minna is a 2L from Houston, TX. She graduated with a History degree from Cornell in 2025, and is
  a proud KJD! In undergrad, she enjoyed writing and directing interactive murder mysteries for
  her dorm to put on. She spent her 1L summer clerking at the Michigan Attorney General’s Office,
  Antitrust Division. Minna is also the Social Chair of On the Board, Treasurer of the First Year
  Information Board, and a member of LAWBreaks. In her spare time she likes to knit, sew, and read
  about medieval war logistics.
