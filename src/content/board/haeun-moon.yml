bio: >-
  Haeun is a 1L from Waco, TX. She majored in Social Studies and Philosophy at Harvard College.
  After graduating in 2024, she worked as an arts consultant. She is currently a member of
  Business Law Association, American Constitution Society, and Entertainment, Media, and Arts Law
  Students Association. In her free time she enjoys practicing yoga, playing violin, and walking
  long distances.
